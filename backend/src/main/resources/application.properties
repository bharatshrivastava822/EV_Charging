spring.application.name=ev-charging-booking

# Database (Environment variable overrides for cloud PaaS & local development)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ev_charging_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security
app.jwt.secret=${APP_JWT_SECRET:ev-charging-booking-secret-key-that-is-long-enough-for-hs512-algorithm-minimum-64-bytes-requirement}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Server Port (Supports cloud container $PORT)
server.port=${PORT:8080}

# CORS Allowed Origins (Local dev & Vercel production frontend)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://ev-charging-peach-one.vercel.app}
