spring.application.name=ev-charging-booking

# Database (Environment variable overrides for cloud PaaS & local development)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./data/evcharge;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# JWT Security
app.jwt.secret=${APP_JWT_SECRET:ev-charging-booking-secret-key-that-is-long-enough-for-hs512-algorithm-minimum-64-bytes-requirement}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Server Port (Supports cloud container $PORT)
server.port=${PORT:8080}

# CORS Allowed Origins (Local dev & Vercel production frontend)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://ev-charging-peach-one.vercel.app}
